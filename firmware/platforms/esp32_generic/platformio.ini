; esp32_generic — classic ESP32 DevKit + external ST7789 SPI panel.
; Wiring defaults below (common VSPI hookup); override via build_flags.
; TN vs IPS panel: RSVP_PANEL_IPS=false for TN panels (colors invert).

[platformio]
src_dir = src
build_dir = .pio

[env:esp32_generic]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
build_flags =
    -std=gnu++17
    -I../../
    -DRSVP_EXPOSE_STATE
    -DRSVP_PANEL_IPS=true
    -DRSVP_BUF_SIZE=0x18000 ; 96KB book buffer — classic ESP32 DRAM is tight
extra_scripts = pre:copy_core.py
