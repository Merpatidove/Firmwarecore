; pico_st7789 — board glue for rsvp_core on Raspberry Pi Pico / Pico W
; (RP2040) and Pico 2 (RP2350). Free wiring, defaults below. Same serial
; SOH protocol as esp32_st7789.

[platformio]
src_dir = src

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
build_flags =
    -std=gnu++17
    -I../../
    -DRSVP_EXPOSE_STATE
    -DRSVP_LCD_W=240
    -DRSVP_LCD_H=320
    -DRSVP_LCD_OFF_X=0
    -DRSVP_LCD_OFF_Y=0
    -DRSVP_PIN_SCK=10
    -DRSVP_PIN_MOSI=11
    -DRSVP_PIN_CS=9
    -DRSVP_PIN_DC=8
    -DRSVP_PIN_RST=12
    -DRSVP_PIN_BL=13
    -DRSVP_PIN_BTN=14
    -DRSVP_SERIAL_BAUD=115200
extra_scripts = pre:copy_core.py

[env:pico_w]
extends = env:pico
board = pico
build_flags =
    ${env:pico.build_flags}
    -DARDUINO_ARCH_RP2040
    -DPICO_W
; note: maxgerhardt fork board IDs are plain "pico" — Pico W needs the
; earlephilhower platform for real CYW43 WiFi. WiFi is NOT core: plain
; "pico" env covers RP2040 reading hardware; W-variants work as pico.

; pico2 (RP2350): needs the earlephilhower platform >= 4.x which supports
; RP2350. Switch `platform` above to:
;   https://github.com/earlephilhower/arduino-pico
; registered as a PlatformIO platform, or install it via `pio pkg update`.
; Kept as a separate env so RP2040 builds stay reproducible.
