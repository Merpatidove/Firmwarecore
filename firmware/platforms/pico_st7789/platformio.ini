; pico_st7789 — Raspberry Pi Pico (RP2040) / Pico 2 (RP2350) + external
; ST7789 SPI panel. Free wiring via build_flags. TN panels: IPS=false.

[platformio]
src_dir = src
build_dir = .pio

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
build_flags =
    -std=gnu++17
    -I../../
    -DRSVP_EXPOSE_STATE
    -DRSVP_PANEL_IPS=true
extra_scripts = pre:copy_core.py

; Pico 2 (RP2350): the maxgerhardt PlatformIO fork lags behind
; earlephilhower's core. To build for RP2350, install the earlephilhower
; platform (supports pico2 board id) and add:
; [env:pico2]
; extends = env:pico
; board = pico2

[env:pico_w]
extends = env:pico
board = pico
build_flags =
    ${env:pico.build_flags}
    -DPICO_W
; note: plain "pico" env covers Pico W reading hardware; real CYW43 WiFi
; needs the earlephilhower core. WiFi is not core — serial companion only.
