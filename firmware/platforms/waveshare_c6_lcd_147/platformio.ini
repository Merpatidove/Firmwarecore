; waveshare_c6_lcd_147 — dedicated glue for Waveshare ESP32-C6-LCD-1.47
; NON-TOUCH. Pinmap hardcoded in main.cpp (verified on the physical board):
; SCK=7 MOSI=6 CS=14 DC=15 RST=21 BL=22 BOOT=9, ST7789 IPS 172x320 offset 34.

[platformio]
src_dir = src
build_dir = .pio

[env:c6_lcd_147]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
build_flags =
    -std=gnu++17
    -I../../
    -DRSVP_EXPOSE_STATE
extra_scripts = pre:copy_core.py
