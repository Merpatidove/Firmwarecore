; esp32_st7789 — board glue for the firmware core (D:\Text-scroller\firmware).
; Default env = Waveshare ESP32-C6-LCD-1.47 NON-TOUCH (verified pinmap:
; SCK=7 MOSI=6 CS=14 DC=15 RST=21 BL=22, ST7789 172x320, offset col/row 34).
; BOOT button (GPIO9) = play/pause; wpm/section nav over USB serial console.
[platformio]
src_dir = src
build_dir = .pio

[env:c6_lcd_147]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
build_flags =
    -std=gnu++17
    -I../../
    -DRSVP_EXPOSE_STATE
    -DRSVP_LCD_W=172
    -DRSVP_LCD_H=320
    -DRSVP_LCD_OFF_X=34
    -DRSVP_LCD_OFF_Y=34
    -DRSVP_PIN_SCK=7
    -DRSVP_PIN_MOSI=6
    -DRSVP_PIN_CS=14
    -DRSVP_PIN_DC=15
    -DRSVP_PIN_RST=21
    -DRSVP_PIN_BL=22
    -DRSVP_PIN_BTN=9
    -DRSVP_SERIAL_BAUD=115200
; compile the core into the firmware (extra_scripts cannot be a bare .c)
; so we copy it into src/ via the pre-script below.
extra_scripts = pre:copy_core.py
; generic ESP32 devkit + external ST7789: override pins with your wiring
[env:esp32_generic]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
build_flags =
    -std=gnu++17
    -DRSVP_LCD_W=240
    -DRSVP_LCD_H=320
    -DRSVP_LCD_OFF_X=0
    -DRSVP_LCD_OFF_Y=0
    -DRSVP_PIN_SCK=18
    -DRSVP_PIN_MOSI=23
    -DRSVP_PIN_CS=5
    -DRSVP_PIN_DC=2
    -DRSVP_PIN_RST=4
    -DRSVP_PIN_BL=15
    -DRSVP_PIN_BTN=0
    -DRSVP_SERIAL_BAUD=115200
extra_scripts = pre:copy_core.py
